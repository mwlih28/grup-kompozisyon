name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NEXT_PUBLIC_API_URL: https://grup-kompozisyon.vercel.app

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://grup-kompozisyon.vercel.app

      - name: Sync Capacitor iOS
        run: |
          npx cap add ios 2>/dev/null || true
          npx cap sync ios

      - name: Build iOS (Simulator)
        run: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Archive (requires Apple credentials in secrets)
        if: env.HAS_CERT == 'true'
        run: |
          cd ios/App
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          echo "$APPLE_PROVISIONING_PROFILE" > profile.mobileprovision
          security create-keychain -p "$KEYCHAIN_PASSWORD" ios-build.keychain
          security default-keychain -s ios-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ios-build.keychain
          security import cert.p12 -k ios-build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CODE_SIGNING_REQUIRED=YES
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && 'true' || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        continue-on-error: true

      - name: Export IPA
        if: success() && env.HAS_CERT == 'true'
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build \
            -allowProvisioningUpdates \
            -exportOptionsPlist ../../.github/workflows/exportOptions.plist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: |
            ios/App/build/**/*.app
            ios/App/build/*.ipa
            ios/App/build/App.xcarchive
