name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NEXT_PUBLIC_API_URL: https://grup-kompozisyon.vercel.app

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://grup-kompozisyon.vercel.app

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS (Simulator)
        run: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios/App/build/

      - name: Build iOS Archive (requires Apple credentials)
        if: env.APPLE_CERTIFICATE != ''
        run: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_CERTIFICATE="$(echo $APPLE_CERTIFICATE | base64 --decode)" \
            PROVISIONING_PROFILE="$APPLE_PROVISIONING_PROFILE" \
            CODE_SIGNING_REQUIRED=YES
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        continue-on-error: true
